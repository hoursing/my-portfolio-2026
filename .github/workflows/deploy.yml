name: Deploy my portfolio

# trigger push on main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permisions:
      contents: write
    steps:
    - name: Checkout Source code
      uses: actions/checkout@v4

    - name: Display files
      run: ls

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./     

